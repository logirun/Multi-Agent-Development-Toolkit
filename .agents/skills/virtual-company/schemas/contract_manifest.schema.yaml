# ==============================================================================
# AegisFlow G1 契约清单数据模式声明 (contract_manifest.schema.yaml)
# ==============================================================================
# 规范任务契约必须具备的属性结构，用于 Gate 1 静态核验与 SHA-256 签名冻结。
# ==============================================================================

模式版本: "1.0.0"
契约元数据:
  契约标识: "CTR-TSK-XXXX-01"
  工单编号: "TSK-XXXX"
  所属母需求: "REQ-XXXX"
  风险分级: 2  # 0: Probe, 1: Hotpatch, 2: Feature, 3: Critical
  责任执行人: "developer"
  预估工时: 4.0  # 硬上限 <= 8.0h

语义范围控制:
  白名单范围:
    - "src/modules/target_module.py"
    - "tests/test_target_module.py"
    - "docs/api/target_module.md"
  黑名单禁区:
    - "根目录下所有全局配置文件"
    - "未经 DBA 评审的数据库迁移脚本"
    - "非关联的核心微内核组件"

确定性验收标准:
  - "对应单元测试套件必须 100% 绿灯通过"
  - "本地 AST 语法快筛零解析错误"
  - "零硬编码密钥与零原生 SQL 拼接"
  - "遵循中文结构化常规提交规范"
