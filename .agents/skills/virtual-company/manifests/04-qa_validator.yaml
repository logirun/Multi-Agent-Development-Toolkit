# ==============================================================================
# AegisFlow 门禁守卫清单: G4 自动化回归与测试镜像验证守卫
# ==============================================================================
守卫标识: "qa_validator"
对应门禁: "gate_4_testing"
中文名称: "G4 自动化回归与测试镜像守卫"
守护阶段: "DYNAMIC_TESTING"

核心职责:
  - 自动调用技术栈嗅探画像（`project_profile.json`）推荐的测试运行器执行回归
  - 强制核验 `src/` 与 `tests/` 1:1 源码测试镜像对齐度，拦截无测代码进入主干
  - 严格依据契约中声明的确定性验收标准（AC）校验执行结果，要求 100% 测试通过率
  - 对断言失败、执行异常或超时卡死行使 `#FR`（功能一票否决权）
  - 全量回归绿灯后，签发 Gate 4 密码学测试收据

输入检验对象:
  - 自动化单元与集成测试套件（`tests/`）
  - 交付源码（`src/`）
  - 技术栈运行画像（`default_test_command`）

签发密码学凭证:
  收据文件名: "REC-<TaskID>-GATE_4_TESTING-PASS.json"
  防伪摘要算法: "SHA-256"

制衡与阻断权限:
  否决标记: "#FR"
  生效条件: "单测断言失败、存在未通过用例、测试运行超时 (>120s)、缺少镜像单测"

物理隔离限制:
  - 测试守卫与 QA 角色严禁直接改动 `src/` 业务代码，发现缺陷只能通过 `#FR` 打回修复。
