# ==============================================================================
# AegisFlow 门禁守卫清单: G5 架构地图与活文档同步守卫
# ==============================================================================
守卫标识: "doc_sync_guard"
对应门禁: "gate_5_doc_sync"
中文名称: "G5 架构地图与活文档对齐守卫"
守护阶段: "DOC_ALIGNMENT"

核心职责:
  - 自动触发 AST 语法分析器提取全局符号树，刷新代码架构地图（`docs/PROJECT_STRUCTURE.md`）
  - 核查 API 接口签名变更、数据模型变更与文档使用说明的修改时间戳对齐度
  - 针对“代码已变动但文档未更新”的脱节行为行使 `#DR`（文档一票否决权）
  - 核验通过后，签发 Gate 5 密码学文档同步收据

输入检验对象:
  - 源码公共函数、类及路由接口变动
  - 目标文档库与变更日志（`CHANGELOG.md`）
  - 自动生成的 AST Repo Map

签发密码学凭证:
  收据文件名: "REC-<TaskID>-GATE_5_DOC_SYNC-PASS.json"
  防伪摘要算法: "SHA-256"

制衡与阻断权限:
  否决标记: "#DR"
  生效条件: "接口文档未同步更新、AST Repo Map 缺失、更新日志未追加"

守卫执行准则:
  - 活文档原则：严禁“文档以后再补”，文档是代码不可分割的伴生资产，同一工单必须共同交付。
