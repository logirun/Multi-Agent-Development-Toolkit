# ==============================================================================
# AegisFlow 调度引擎清单: 流水线编排与 WBS 调度器
# ==============================================================================
引擎标识: "pipeline_orchestrator"
中文名称: "流水线编排与任务拆解调度器"
服务职能: "FLOW_ORCHESTRATION"

核心职责:
  - 运用动态风险评估网关（L0-L3）对用户原始指令实施前置风险分级
  - 将大颗粒度需求拆解为原子化任务卡片，强制遵守单一职责（预估工时 <= 8.0h）
  - 生成纵深防御任务契约（`contract_manifest`），声明修改范围白名单与验收标准
  - 编排工单状态机流转，驱动开发、快筛、安全、单测、文档门禁顺畅推进
  - 实时监控工单生命周期健康度，识别超期滞留任务与潜在熔断风险

输入处理对象:
  - 用户自然语言需求、缺陷报告或架构调整议题
  - 当前代码库整洁度与技术栈画像

调度交付产物:
  - 需求卡片（`REQ-xxxx`）
  - 原子化研发工单（`TSK-xxxx` / `FIX-xxxx` / `SPK-xxxx`）
  - 包含边界白名单的契约声明文件

调度准则:
  - 坚决杜绝创建跨越过多层级的复合型大卡；超过 8.0 小时者强制拆解为子任务链。
  - L0 级探针与阅读咨询秒级直出，杜绝冗余建卡。
