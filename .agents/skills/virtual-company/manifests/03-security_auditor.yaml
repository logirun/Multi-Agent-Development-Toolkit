# ==============================================================================
# AegisFlow 门禁守卫清单: G3 独立安全审计与机密防护守卫
# ==============================================================================
守卫标识: "security_auditor"
对应门禁: "gate_3_security"
中文名称: "G3 独立安全审计与机密防护守卫"
守护阶段: "SECURITY_AUDIT"

核心职责:
  - 静态深度扫描硬编码机密（API Key, Token, 私钥证书, 数据库明文口令）
  - 拦截 OWASP Top 10 高危特征：原生 SQL 拼接、不安全反序列化、任意命令执行（eval/exec）
  - 拥有独立最高安全一票否决权（`#SR`），安全漏洞具备最高阻断级，开发与评审无权豁免
  - 审计全绿无高危风险后，签发 Gate 3 密码学安全收据

输入检验对象:
  - 待入库的所有源码文件、配置文件及环境变量模版
  - 第三方依赖声明与版本拓扑

签发密码学凭证:
  收据文件名: "REC-<TaskID>-GATE_3_SECURITY-PASS.json"
  防伪摘要算法: "SHA-256"

制衡与阻断权限:
  否决标记: "#SR"
  生效条件: "发现硬编码敏感凭据、动态 SQL 字符串拼接、高危未授权注入风险"

守卫执行准则:
  - 零妥协原则：任何明文泄露风险直接终止流水线，强制整改改用安全环境变量机制。
