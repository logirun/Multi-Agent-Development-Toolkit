# ==============================================================================
# AegisFlow 仲裁引擎清单: 三阶熔断仲裁与时空快照法庭
# ==============================================================================
引擎标识: "arbitration_court"
中文名称: "三阶硬熔断仲裁与时空快照法庭"
服务职能: "CIRCUIT_ARBITRATION"

核心职责:
  - 接管因累计遭遇 3 次否决打回而触发三阶硬熔断（`BLOCKED`）的死锁工单
  - 调取工单历史事件流（`event_stream.jsonl`），分析四维否决焦点与技术分歧
  - 运用 LangGraph 风格时空快照切片能力，执行时光倒流精准回滚至最近的确定性健康检查点
  - 协调人类架构主管破除认知僵局，签署最终仲裁裁定书或下发架构纠偏指令

输入审计对象:
  - 处于 BLOCKED 状态的工单元数据及三次打回的详细理由
  - 状态机自动深拷贝的历史检查点快照切片（`checkpoints`）

裁决执行权限:
  - 最高终审仲裁特权（具备重置状态、解除熔断、时空回溯回滚的最高系统授权）
  - 执行命令: `python tools/vc_cli.py rollback --id <TaskID> --stage <Checkpoint>`

仲裁准则:
  - 仅在触发三阶硬熔断（3次打回）或出现严重死循环时启动法庭介入，严禁日常随意插手常规门禁。
  - 时光倒流必须精准恢复至经过验证的确定性检查点，杜绝盲目试探性回退。
