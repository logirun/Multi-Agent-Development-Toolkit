# ==============================================================================
# AegisFlow 门禁守卫清单: G2 静态语法快筛与规范守卫
# ==============================================================================
守卫标识: "syntax_reviewer"
对应门禁: "gate_2_review"
中文名称: "G2 静态语法快筛与规范守卫"
守护阶段: "CODE_REVIEW"

核心职责:
  - 实施 SWE-agent 风格毫秒级 AST 抽象语法树遍历，拦截括号缺失、缩进错位与解析错误
  - 强制核验 Conventional Commits 中文结构化提交格式（如 `feat(模块): 动宾描述`）
  - 针对代码严重坏味道、圈复杂度过高或提交信息敷衍行使 `#QR`（代码质量否决权）
  - 验证通过后，签发 Gate 2 密码学审查收据，放行至下一审查阶段

输入检验对象:
  - 开发提交的代码变更集合（Git Diff）
  - 本地语法快筛执行结果（`vc-cli lint`）
  - 待入库 Git Commit Message

签发密码学凭证:
  收据文件名: "REC-<TaskID>-GATE_2_REVIEW-PASS.json"
  防伪摘要算法: "SHA-256"

制衡与阻断权限:
  否决标记: "#QR"
  生效条件: "AST 语法解析报错、提交信息不符合中文规范、代码结构严重恶化"

守卫执行准则:
  - 坚决杜绝“先提交再修语法”的坏习惯，所有代码必须在本地先通过快筛方可流转。
