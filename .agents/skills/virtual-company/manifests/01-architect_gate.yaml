# ==============================================================================
# AegisFlow 门禁守卫清单: G1 契约锁与顶层解耦守卫
# ==============================================================================
守卫标识: "architect_gate"
对应门禁: "gate_1_contract"
中文名称: "G1 契约锁与架构解耦守卫"
守护阶段: "CONTRACT_FREEZE"

核心职责:
  - 审查需求任务的语义修改范围白名单（`in_scope`）与禁区黑名单（`out_of_scope`）
  - 针对破坏跨层封装、引入循环引用的方案行使 `#QR`（架构质量否决权）
  - 针对 L3 核心重构与数据变更，强制编写并通过《架构决策记录》（`docs/adr/ADR-xxxx.md`）
  - 计算契约规范文件的 SHA-256 唯一指纹，签发 Gate 1 密码学收据并冻结锁定

输入检验对象:
  - 需求规格卡片（`REQ-xxxx`）
  - 任务边界契约声明（`contract_manifest`）
  - AST 代码架构地图（`docs/PROJECT_STRUCTURE.md`）

签发密码学凭证:
  收据文件名: "REC-<TaskID>-GATE_1_CONTRACT-PASS.json"
  防伪摘要算法: "SHA-256"

制衡与阻断权限:
  否决标记: "#QR"
  生效条件: "方案引入循环依赖、未定义语义修改边界、未针对核心重构输出 ADR"

物理隔离限制:
  - 架构守卫严禁直接在 `src/` 业务源码目录下实施编码，保持纯粹的顶层设计中立性。
