# ==============================================================================
# AegisFlow 虚拟软件工坊核心治理配置 (core_config.yaml)
# ==============================================================================
# 集中定义神盾微内核的工程治理参数、风险网关准则、质量门禁阈值与熔断仲裁策略。
# ==============================================================================

微内核元数据:
  系统标识: "AegisFlow Kernel"
  中文全称: "神盾代码治理与多智能体确定性门禁系统"
  架构版本: "3.2.0"
  运行环境: "Python 3.10+"
  交互语言: "zh-CN"

# --- 1. 流水线与风控限额 ---
流水线风控参数:
  # 单一职责原则 (SRP) 单任务预估工时硬上限 (小时)
  单任务工时上限: 8.0
  # 判定研发任务滞留停滞的超期报警阈值 (小时)
  停滞超时预警阈值: 8.0
  # 防秒冲假执行拦截：判定模型秒级虚假完成的最短耗时底线 (秒)
  防秒冲耗时底线: 5.0
  # 控制台看板与上下文默认最大展示任务数 (防 Token 膨胀保护)
  终端展示节流上限: 5

# --- 2. 异常熔断与仲裁机制 ---
熔断与仲裁策略:
  # 单一工单触发三阶硬熔断 (BLOCKED 状态) 的累计打回上限
  三阶熔断阈值: 3
  # 拥有熔断解除、死锁破局与时光倒流回滚最高裁决权的仲裁实体
  最高仲裁实体: "arbitration_court"
  # Gate 6 是否强制校验控制台物理 TTY (sys.stdin.isatty())
  强制物理终端验收: true

# --- 3. 动态风险评估网关 (Risk Matrix) ---
风险评估网关:
  level_0:
    分级代码: "L0"
    通道名称: "Probe (只读探针通道)"
    适用场景: "静态代码审阅、架构释义咨询、知识库检索、不产生任何文件变动"
    门禁准入要求: []
    是否创建工单: false
    是否签发收据: false

  level_1:
    分级代码: "L1"
    通道名称: "Hotpatch (单点微修通道)"
    适用场景: "单文件轻量缺陷修复、局部注释微调、技术可行性探索探针 (< 2.0h)"
    门禁准入要求: ["gate_2_review", "gate_4_testing"]
    是否创建工单: true
    是否签发收据: true

  level_2:
    分级代码: "L2"
    通道名称: "Feature (标准特性流水线)"
    适用场景: "常规业务功能研发、多模块逻辑新增或重构 (2.0h - 8.0h)"
    门禁准入要求:
      - "gate_1_contract"      # 契约锁定与范围白名单
      - "gate_2_review"        # 静态语法快筛与提交格式
      - "gate_3_security"      # 独立安全审计与敏感词
      - "gate_4_testing"       # 自动化测试与镜像对齐
      - "gate_5_doc_sync"      # 活文档与架构地图对齐
      - "gate_6_human_accept"  # 人类物理终端终审验收
    是否创建工单: true
    是否签发收据: true

  level_3:
    分级代码: "L3"
    通道名称: "Critical (核心架构与数据锁)"
    适用场景: "数据库 Schema/DDL 迁移、认证协议更迭、跨底层模块重构"
    门禁准入要求:
      - "gate_1_contract"
      - "gate_2_review"
      - "gate_3_security"
      - "gate_4_testing"
      - "gate_5_doc_sync"
      - "gate_6_human_accept"
    强制输出ADR: true
    双向无损迁移校验: true

# --- 4. 六重确定性质量门禁规则 ---
确定性门禁准则:
  gate_1_contract:
    门禁标识: "gate_1_contract"
    中文名称: "契约范围冻结门禁"
    校验算法: "sha256"
    强制白名单约束: true

  gate_2_review:
    门禁标识: "gate_2_review"
    中文名称: "静态快筛与规范门禁"
    开启AST语法快筛: true
    强制中文常规提交: true
    提交校验表达式: "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\\([a-zA-Z0-9_\\u4e00-\\u9fa5-]+\\))?: .+"

  gate_3_security:
    门禁标识: "gate_3_security"
    中文名称: "独立安全审计门禁"
    敏感凭据扫描特征:
      - "(?i)(api[_-]?key|secret|token|password|passwd|private_key|aws_access|jwt_secret)\\s*[:=]\\s*['\"][^'\"]{8,}['\"]"
    动态注入拼接特征:
      - "(?i)(SELECT|INSERT|UPDATE|DELETE|DROP).*\\+.*['\"]"
      - "(?i)f['\"].*(SELECT|INSERT|UPDATE|DELETE|DROP).*\\{"

  gate_4_testing:
    门禁标识: "gate_4_testing"
    中文名称: "自动化测试与镜像门禁"
    开启技术栈自适应嗅探: true
    单测运行超时上限秒数: 120
    强制测试用例通过率: 1.0  # 100% 通过
    强制源码测试镜像对齐: true

  gate_5_doc_sync:
    门禁标识: "gate_5_doc_sync"
    中文名称: "架构地图与活文档同步门禁"
    开启AST架构地图自动刷新: true
    架构地图目标路径: "docs/PROJECT_STRUCTURE.md"

  gate_6_human_accept:
    门禁标识: "gate_6_human_accept"
    中文名称: "人类物理交互终审门禁"
    强制终端TTY核验: true
    终态锁定防反悔: true
